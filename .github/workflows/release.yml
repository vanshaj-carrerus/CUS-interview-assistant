name: publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    permissions:
      contents: write
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        args: ['']

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: install dependencies
        run: npm ci

      - name: build frontend
        run: npm run build

      # Attach bundles to the tag that triggered this workflow. Using only
      # v__VERSION__ from tauri.conf would upload to e.g. v0.1.0 while you
      # pushed v0.0.1 — assets would appear on the wrong (or duplicate) release.
      - name: build tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CARGO_BUILD_JOBS: 4
          RUSTFLAGS: '-C target-feature=+crt-static'
        with:
          projectPath: src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'CUS Interview Assistant ${{ github.ref_name }}'
          releaseBody: 'Automatic interview assistant update.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
          args: ${{ matrix.args }}
