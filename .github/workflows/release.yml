name: publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install dependencies
        run: npm ci

      # Groq is required for client-side STT (Whisper chunks). Accept either secret name.
      - name: Prepare Groq STT env for build
        shell: pwsh
        run: |
          $key = '${{ secrets.VITE_GROQ_API_KEY }}'.Trim()
          if ([string]::IsNullOrWhiteSpace($key)) {
            $key = '${{ secrets.GROQ_API_KEY }}'.Trim()
          }
          if ([string]::IsNullOrWhiteSpace($key)) {
            Write-Error 'Set repository secret VITE_GROQ_API_KEY or GROQ_API_KEY (Groq console API key).'
          }
          "VITE_GROQ_API_KEY=$key" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GROQ_API_KEY=$key" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and publish release (with updater artifacts)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_API_URL: https://www.custech.co
          VITE_GROQ_API_KEY: ${{ env.VITE_GROQ_API_KEY }}
          GROQ_API_KEY: ${{ env.GROQ_API_KEY }}
          CARGO_BUILD_JOBS: 4
          RUSTFLAGS: '-C target-feature=+crt-static'
        with:
          tagName: ${{ github.ref_name }}
          releaseName: CUS Interview Assistant ${{ github.ref_name }}
          releaseBody: |
            Install the setup `.exe` for new users. Existing installs auto-update from this release.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --target x86_64-pc-windows-msvc
